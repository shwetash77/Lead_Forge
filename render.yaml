# Render Blueprint: deploys the API (from the Dockerfile) plus a PostgreSQL database.
services:
  - type: web
    name: leadforge-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: leadforge-db
          property: connectionString
      - key: LEADFORGE_API_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: HUBSPOT_TOKEN
        sync: false

databases:
  - name: leadforge-db
    plan: free